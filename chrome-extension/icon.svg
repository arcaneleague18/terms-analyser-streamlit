<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Minimalist Background Surface -->
  <rect width="128" height="128" rx="24" fill="#121316" />
  <rect x="1" y="1" width="126" height="126" rx="23" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
  
  <!-- Icon Graphics (Minimalist Scales) -->
  <g transform="translate(64, 64) scale(1.15)">
    <!-- Base / Stand -->
    <path d="M -14 25 L 14 25 M 0 25 L 0 -16" stroke="#f0f0f2" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Beam -->
    <path d="M -28 -12 L 28 -12" stroke="#f0f0f2" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- Center Pivot -->
    <circle cx="0" cy="-12" r="2.5" fill="#f0f0f2" />
    
    <!-- Left Scale -->
    <g transform="translate(-28, -12)">
      <!-- Strings -->
      <path d="M 0 0 L -10 16 M 0 0 L 10 16" stroke="#8c8f97" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Pan -->
      <path d="M -14 16 C -14 22, 14 22, 14 16 Z" fill="#f0f0f2" />
    </g>
    
    <!-- Right Scale -->
    <g transform="translate(28, -12)">
      <!-- Strings -->
      <path d="M 0 0 L -10 16 M 0 0 L 10 16" stroke="#8c8f97" stroke-width="2" stroke-linecap="round" fill="none"/>
      <!-- Pan -->
      <path d="M -14 16 C -14 22, 14 22, 14 16 Z" fill="#f0f0f2" />
    </g>
  </g>
</svg>
