<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5865f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#854cef;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="url(#grad)" />
  <!-- Icon Graphics (Scales) -->
  <g transform="translate(64, 64) scale(1.15)" filter="url(#glow)">
    <!-- Base / Stand -->
    <path d="M -12 25 L 12 25 M -6 25 L -3 20 L 3 20 L 6 25 M 0 20 L 0 -18" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Beam -->
    <path d="M -30 -12 L 30 -12" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Center Pivot -->
    <circle cx="0" cy="-12" r="3.5" fill="#ffffff" />
    
    <!-- Left Scale -->
    <g transform="translate(-30, -12)">
      <!-- Strings -->
      <path d="M 0 0 L -12 18 M 0 0 L 12 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <!-- Pan -->
      <path d="M -16 18 C -16 24, 16 24, 16 18 Z" fill="#ffffff" />
    </g>
    
    <!-- Right Scale -->
    <g transform="translate(30, -12)">
      <!-- Strings -->
      <path d="M 0 0 L -12 18 M 0 0 L 12 18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>
      <!-- Pan -->
      <path d="M -16 18 C -16 24, 16 24, 16 18 Z" fill="#ffffff" />
    </g>
  </g>
</svg>
